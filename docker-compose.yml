# This docker compose file can be used to start up a statemodify notebook locally
# for testing.
services:
  notebook:
    container_name: uc-ebook-notebook
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/msd-live/jupyter/uc-ebook-notebook:latest
    ports:
      - "8888:8888"
    volumes:
      - ./data:/home/jovyan/data
      - ./notebooks:/home/jovyan/notebooks
    environment:
      - DATA_DIR=/home/jovyan/data
      # uncomment below and update if port needs to be different
      # also update port mapping under ports section
      #- JUPYTER_PORT=8888
